<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1013">
  <meta name="description" content="Choose an engineering discipline and run an interactive simulation in the Nexora Engineering Lab.">
  <title>Experiment Catalog · Nexora Engineering Lab</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/shell.ts"></script>
  <script type="module" src="/catalog.js"></script>
</head>
<body>
  <!-- site-header -->
  <div class="catalog-layout">
    <aside class="catalog-rail">
      <nav class="catalog-sidebar" aria-label="Engineering disciplines" hidden>
        <h2>Disciplines</h2>
        <div class="discipline-links" id="discipline-links"></div>
      </nav>
    </aside>
    <main class="catalog-main" id="main" tabindex="-1">
      <header class="intro">
        <div>
          <p class="breadcrumb mono">NEXORA / ENGINEERING LAB</p>
          <h1>Experiment catalog<span>.</span></h1>
          <p class="intro-copy">Choose a discipline, set up an experiment, and see how the model responds.</p>
        </div>
      </header>
      <form class="panel catalog-controls" id="catalog-filters" role="search" hidden>
        <div><label for="lab-search">Search experiments</label><input id="lab-search" type="search" placeholder="Try deflection or stress"></div>
        <div><label for="discipline-filter">Discipline</label><select class="material-select" id="discipline-filter">
          <option value="">All disciplines</option>
          <option value="civil">Civil engineering</option>
          <option value="mechanical">Mechanical engineering</option>
          <option value="electrical">Electrical engineering</option>
          <option value="electronics">Electronics</option>
          <option value="signals">Signals &amp; systems</option>
        </select></div>
        <button class="quiet" type="reset">Clear filters</button>
        <p id="catalog-status" role="status"></p>
      </form>
      <div class="catalog-grid" id="catalog-grid"></div>
      <p class="coming-soon"><strong>Coming soon</strong> · Trusses, gears, and digital logic.</p>
      <footer><span class="mono">NEXORA / EXPERIMENT CATALOG</span><span>For education and exploration</span></footer>
    </main>
  </div>
</body>
</html>
